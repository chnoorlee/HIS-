name: inpatient-voice
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: his
      POSTGRES_USER: his
      POSTGRES_PASSWORD: ${HIS_DB_PASSWORD:?Run scripts/setup.ps1 and use --env-file .local/compose.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his -d his"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_environment
      HIS_ENV: development
      HIS_DATABASE_URL: postgresql+psycopg://his:${HIS_DB_PASSWORD}@postgres:5432/his
      HIS_DATA_DIR: /data
      HIS_JWT_SECRET: ${HIS_JWT_SECRET:?Missing signing key}
      HIS_AUDIO_KEY: ${HIS_AUDIO_KEY:?Missing audio encryption key}
      HIS_ALLOWED_ORIGINS: http://127.0.0.1:5180,http://localhost:5180
      HIS_MODEL_PROVIDER: demo
      HIS_ASR_PROVIDER: unavailable
      HIS_EMR_PROVIDER: mock
      HIS_RUN_WORKER: "false"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8787", "--no-access-log"]
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - audio_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    volumes:
      - audio_data:/data
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  audio_data:
